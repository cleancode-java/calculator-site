<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Document</title>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="p-6">
    <a href="/" class="text-2xl font-bold hover:opacity-80">
      <span class="text-emerald-900">Fin</span>
      <span class="text-emerald-700">Loggy</span>
    </a>
  </header>

  <!-- Main -->
  <main class="flex-grow flex items-center justify-center">

    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">

      <!-- Back button -->
      <a href="/" class="text-sm text-emerald-700 hover:underline mb-6 inline-block">
        ← Back to Home
      </a>

      <h2 class="text-2xl font-bold text-center mb-6">
        Login to FinLoggy
      </h2>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Email</label>
        <input 
          id="email"
          type="email"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600"
        />
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-sm font-medium mb-1">Password</label>
        <input 
          id="password"
          type="password"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600"
        />
      </div>

      <!-- Buttons -->
      <div class="flex flex-col gap-3">
        <button 
          id="loginBtn"
          class="bg-emerald-600 text-white py-2 rounded hover:bg-emerald-700 transition"
        >
          Log in
        </button>

        <button 
          id="signupBtn"
          class="border border-emerald-600 text-emerald-700 py-2 rounded hover:bg-emerald-50 transition"
        >
          Sign up
        </button>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="py-6 bg-gray-100 text-center text-sm text-gray-600">
    <p>&copy; <span id="currentYear"></span> FinLoggy. All rights reserved.</p>
    <p>
      <a href="terms-of-service.html" class="underline">Terms of Service</a> |
      <a href="privacy.html" class="underline">Privacy Policy</a>
    </p>
    <p>
      <a href="contact-us.html" class="underline">Feedback / Contact us</a>
    </p>
  </footer>

  <script type="module" src="/js/login.js"></script>

</body>
</html>
