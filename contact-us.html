<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Contact us</title>
</head>
<body class="bg-gray-100 text-gray-900">
    <div id="header"></div>

<div class="max-w-2xl mx-auto mt-12 p-8 bg-white border border-gray-100 rounded-2xl shadow-sm text-center">
    <h3 class="text-2xl font-bold text-gray-900 mb-3">Feedback Form</h3>

    <form id="feedbackForm" class="space-y-4 text-left">

        <label class="block">
            <span class="text-gray-700">Your Name</span>
            <input type="text" id="name" name="name" required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
        </label>

        <label class="block">
            <span class="text-gray-700">Email</span>
            <input type="email" id="email" name="email" required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
        </label>

        <label class="block">
            <span class="text-gray-700">Message</span>
            <textarea id="message" name="message" required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></textarea>
        </label>

        <button type="submit"
            class="px-4 py-2 bg-fuchsia-600 text-white rounded hover:bg-fuchsia-700">
            Send Feedback
        </button>

    </form>

    <p id="feedbackStatus" class="mt-4 text-sm text-green-600"></p>
</div>

    <div>
        <footer class="mt-12 py-6 bg-gray-100 text-center text-sm text-gray-600">
            <p>&copy; <span id="currentYear"></span> AcciVell. All rights reserved.</p>
            <p>
                <a href="terms-of-service.html" class="underline">Terms of Service</a> |
                <a href="privacy.html" class="underline">Privacy Policy</a>
            </p>
            <p>
                <a href="contact-us.html" class="underline">Feedback / Contact us</a>
            </p>
        </footer>
    </div>




    <script src="/js/main.js" defer></script>
</body>

</html>
